
name: Build Free My TV - Custom APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate custom configuration
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          key = os.environ.get("TMDB_KEY", "").strip()

          if not key:
              raise SystemExit("ERROR: TMDB_KEY secret is missing!")

          example = Path("config.example.properties")

          if not example.is_file():
              raise SystemExit(
                  "ERROR: config.example.properties not found!"
              )

          config = example.read_text(encoding="utf-8")

          settings = {
              "tmdb_key": key,
              "tmdb_region": "BR",
              "language": "pt",
              "currency": "BRL",
              "city": "Itaipulândia",
              "latitude": "-25.14",
              "longitude": "-54.30",
          }

          for name, value in settings.items():
              pattern = rf"(?m)^{re.escape(name)}=.*$"

              config, count = re.subn(
                  pattern,
                  lambda _, n=name, v=value: f"{n}={v}",
                  config
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Invalid configuration property: {name}"
                  )

          Path("config.properties").write_text(
              config,
              encoding="utf-8"
          )

          print("Custom configuration generated successfully!")
          PY

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.FREEMYTV_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.FREEMYTV_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEYSTORE_PASS" ]; then
              echo "ERROR: Missing FREEMYTV_KEYSTORE_PASS"
              exit 1
            fi

            printf '%s' "$KEYSTORE_B64" \
              | base64 --decode > "$RUNNER_TEMP/freemytv.keystore"

            if [ ! -s "$RUNNER_TEMP/freemytv.keystore" ]; then
              echo "ERROR: Keystore is empty or invalid"
              exit 1
            fi

            echo "FREEMYTV_KEYSTORE=$RUNNER_TEMP/freemytv.keystore" \
              >> "$GITHUB_ENV"

            echo "Persistent signing keystore configured."
          else
            echo "::warning::No persistent keystore configured. APK updates may require uninstalling the previous version."
          fi

      - name: Build APK
        env:
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.FREEMYTV_KEYSTORE_PASS }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify APK
        run: |
          if [ ! -f FreeMyTV.apk ]; then
            echo "ERROR: FreeMyTV.apk was not generated!"
            exit 1
          fi

          if [ ! -s FreeMyTV.apk ]; then
            echo "ERROR: APK is empty!"
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh FreeMyTV.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-HY300
          path: FreeMyTV.apk
          if-no-files-found: error
          retention-days: 14
